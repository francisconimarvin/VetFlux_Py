<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ingreso - VetFlux</title>
    <style>
        body {
            font-family: "Courier New", Courier, monospace;
            font-size: 16px;
            background: #fff;
            color: #000;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .contenedor {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .caja {
            width: 100%;
            max-width: 360px;
            border: 2px solid #000;
            padding: 24px;
            box-sizing: border-box;
        }

        h1 {
            font-size: 22px;
            margin: 0 0 6px 0;
            text-align: center;
        }

        .sub {
            text-align: center;
            margin: 0 0 20px 0;
            font-size: 14px;
        }

        p {
            margin: 0 0 14px 0;
        }

        label {
            display: block;
            margin-bottom: 4px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 16px;
            padding: 8px;
            border: 1px solid #000;
        }

        button {
            width: 100%;
            font-family: inherit;
            font-size: 16px;
            padding: 10px;
            background: #000;
            color: #fff;
            border: 1px solid #000;
            cursor: pointer;
        }

        button:hover {
            background: #fff;
            color: #000;
        }

        .errorlist {
            color: #a00;
            list-style: none;
            padding: 0;
            margin: 0 0 14px 0;
        }

        .pie {
            border-top: 1px solid #000;
            padding: 10px;
            text-align: center;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="contenedor">
        <div class="caja">
            <h1>VetFlux</h1>
            <p class="sub">Inicia sesión para continuar</p>

            <form method="post">
                {% csrf_token %}
                {{ form.non_field_errors }}
                {{ form.as_p }}
                <input type="hidden" name="next" value="{{ next }}">
                <button type="submit">[ Entrar ]</button>
            </form>
        </div>
    </div>

    <footer class="pie">® Fluxware, 2026. Author: <a href="https://marvinfrancisconi.com">Marvin Francisconi</a>
    </footer>

</body>

</html>
