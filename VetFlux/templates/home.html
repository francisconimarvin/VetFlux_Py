<!-- templates/home.html -->
{% extends "base.html" %}
{% block titulo %}Inicio{% endblock %}
{% block contenido %}
<h1>Bienvenida/o, {{ user.first_name }}.</h1>
<p>¿Qué vamos a hacer hoy?</p>

<div id="escenario"></div>

<style>
    #escenario {
        position: relative;
        width: 100%;
        height: 400px;
        border: 1px solid #000;
        overflow: hidden;
        margin-top: 20px;
    }

    .mascota {
        position: absolute;
        font-size: 40px;
        user-select: none;
        text-align: center;
    }

    .mascota span {
        display: block;
        font-size: 12px;
        font-family: "Courier New", monospace;
        white-space: nowrap;
    }
</style>

{{ pacientes|json_script:"datos-pacientes" }}

<script>
    const pacientes = JSON.parse(document.getElementById('datos-pacientes').textContent);
    const escenario = document.getElementById('escenario');

    const emojis = {
        'Canino': '🐶',
        'Felino': '🐱',
    };

    const mascotas = pacientes.map(p => {
        const el = document.createElement('div');
        el.className = 'mascota';
        el.innerHTML = `${emojis[p.especie] || '🐾'}<span></span>`;
        el.querySelector('span').textContent = p.nombre;
        escenario.appendChild(el);
        return {
            el,
            x: Math.random() * (escenario.clientWidth - 80),
            y: Math.random() * (escenario.clientHeight - 80),
            dx: (Math.random() < 0.5 ? -1 : 1) * (0.5 + Math.random()),
            dy: (Math.random() < 0.5 ? -1 : 1) * (0.5 + Math.random()),
        };
    });

    function mover() {
        const maxX = escenario.clientWidth - 60;
        const maxY = escenario.clientHeight - 60;
        mascotas.forEach(m => {
            m.x += m.dx;
            m.y += m.dy;
            if (m.x <= 0 || m.x >= maxX) m.dx *= -1;
            if (m.y <= 0 || m.y >= maxY) m.dy *= -1;
            m.el.style.left = m.x + 'px';
            m.el.style.top = m.y + 'px';
        });
        requestAnimationFrame(mover);
    }

    mover();
</script>
{% endblock %}
