<!-- templates/ficha/confirmar_eliminar.html -->
{% extends "base.html" %}
{% block titulo %}Eliminar ficha{% endblock %}
{% block contenido %}
<h1>¿Eliminar la ficha "{{ ficha.titulo }}"?</h1>
<form method="post">
    {% csrf_token %}
    <button type="submit">[ Sí, eliminar ]</button>
    <a href="{% url 'ficha_lista' %}">[ Cancelar ]</a>
</form>
{% endblock %}
