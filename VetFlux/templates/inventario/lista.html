<!-- templates/inventario/lista.html -->
{% extends "base.html" %}
{% block titulo %}Mi inventario{% endblock %}
{% block contenido %}
<h1>Mi inventario</h1>
<table>
    <tr>
        <th>Instrumento</th>
        <th>Cantidad</th>
        <th></th>
    </tr>
    {% for i in items %}
    <tr>
        <td>{{ i.instrumento_fk.nombre }}</td>
        <td>{{ i.cantidad }}</td>
        <td><a href="{% url 'inventario_editar' i.pk %}">[ editar ]</a></td>
    </tr>
    {% empty %}
    <tr>
        <td colspan="3">No tienes instrumentos en inventario.</td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
