<!-- templates/receta/confirmar_eliminar.html -->
{% extends "base.html" %}
{% block titulo %}Eliminar receta{% endblock %}
{% block contenido %}
<h1>¿Eliminar la receta de {{ receta.paciente_fk.nombre }}?</h1>
<form method="post">
    {% csrf_token %}
    <button type="submit">[ Sí, eliminar ]</button>
    <a href="{% url 'receta_lista' %}">[ Cancelar ]</a>
</form>
{% endblock %}
