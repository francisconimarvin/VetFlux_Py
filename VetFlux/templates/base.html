<!-- templates/base.html -->

<!DOCTYPE html>
<html lang="es">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">
    <title>{% block titulo %}Inicio{% endblock %}</title>
    <style>
        body {
            font-family: "Courier New", Courier, monospace;
            font-size: 16px;
            background: #fff;
            color: #000;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .layout {
            flex: 1;
            display: flex;
        }

        aside {
            width: 200px;
            border-right: 1px solid #000;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        aside nav {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        aside a {
            color: #0000ee;
            text-decoration: underline;
        }

        aside a:visited {
            color: #551a8b;
        }

        aside a:hover {
            background: #000;
            color: #fff;
            text-decoration: none;
        }

        main {
            flex: 1;
            padding: 20px 30px;
        }

        h1 {
            font-size: 20px;
            margin: 0 0 10px 0;
        }

        button {
            font-family: inherit;
            background: none;
            border: none;
            color: #0000ee;
            text-decoration: underline;
            cursor: pointer;
            padding: 0;
            font-size: 16px;
        }

        .salir {
            margin-top: auto;
        }

        .pie {
            border-top: 1px solid #000;
            padding: 10px;
            text-align: center;
            font-size: 13px;
        }

        table {
            display: block;
            overflow-x: auto;
            max-width: 100%;
        }

        input,
        select,
        textarea {
            max-width: 100%;
        }

        @media (max-width: 600px) {
            .layout {
                flex-direction: column;
            }

            aside {
                width: auto;
                border-right: none;
                border-bottom: 1px solid #000;
            }

            main {
                padding: 15px;
            }

            aside nav {
                flex-direction: row;
                flex-wrap: wrap;
                gap: 12px;
            }

            .salir {
                margin-top: 10px;
            }
        }
    </style>
</head>

<body>

    <div class="layout">
        <aside>
            <h1>Menú</h1>
            <nav>
                <a href="{% url 'home' %}">Inicio</a>
                <a href="{% url 'paciente' %}">Paciente</a>
                <a href="{% url 'tutor' %}">Tutor</a>
                <a href="{% url 'agenda' %}">Agenda</a>
                <a href="{% url 'inventario' %}">Inventario</a>
                <a href="{% url 'ficha' %}">Fichas médicas</a>
                <a href="{% url 'receta' %}">Recetas</a>
            </nav>

            <form class="salir" method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button type="submit">[ Salir ]</button>
            </form>
        </aside>

        <main>
            {% block contenido %}{% endblock %}
        </main>
    </div>

    <footer class="pie">® Fluxware, 2026. Author: <a href="https://marvinfrancisconi.com">Marvin Francisconi</a>
    </footer>

</body>

</html>
