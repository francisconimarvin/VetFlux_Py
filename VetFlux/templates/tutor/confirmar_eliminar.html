<!-- templates/tutor/confirmar_eliminar.html -->
{% extends "base.html" %}
{% block titulo %}Eliminar tutor{% endblock %}
{% block contenido %}
<h1>¿Eliminar a {{ tutor.nombre }}?</h1>
<form method="post">
    {% csrf_token %}
    <button type="submit">[ Sí, eliminar ]</button>
    <a href="{% url 'tutor_lista' %}">[ Cancelar ]</a>
</form>
{% endblock %}
