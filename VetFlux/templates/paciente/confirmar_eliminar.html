<!-- templates/paciente/confirmar_eliminar.html -->
{% extends "base.html" %}
{% block titulo %}Eliminar paciente{% endblock %}
{% block contenido %}
<h1>¿Eliminar a {{ paciente.nombre }}?</h1>
<form method="post">
    {% csrf_token %}
    <button type="submit">[ Sí, eliminar ]</button>
    <a href="{% url 'paciente_lista' %}">[ Cancelar ]</a>
</form>
{% endblock %}
